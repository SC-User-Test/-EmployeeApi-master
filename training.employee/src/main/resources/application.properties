
## Spring DATASOURCE (DataSourceAutoConfiguration & DataSourceProperties)
## Use environment variables for cloud deployment
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/users_database?useSSL=false}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

## HikariCP Connection Pool Configuration for Cloud
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:30000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT:600000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME:1800000}

## Hibernate Properties
# The SQL dialect makes Hibernate generate better SQL for the chosen database
spring.jpa.properties.hibernate.dialect=${DB_DIALECT:org.hibernate.dialect.MySQL5InnoDBDialect}

# Hibernate ddl auto (create, create-drop, validate, update)
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}

## Application Info
info.app.name=${APP_NAME:Spring Boot - RestTemplate CRUD Rest Client Example}
info.app.description=${APP_DESCRIPTION:Spring Boot - RestTemplate CRUD Rest Client Example}
info.app.version=${APP_VERSION:1.0.0}

## Server Configuration
server.servlet.context-path=${CONTEXT_PATH:/springboot-crud-rest}
server.port=${PORT:8080}

## Logging Configuration for Cloud
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.level.root=${LOG_LEVEL:INFO}
logging.level.com.pedrolima.training=${APP_LOG_LEVEL:DEBUG}

## Management and Health Check Endpoints for Cloud
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.health.db.enabled=true